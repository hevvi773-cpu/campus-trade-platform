<!DOCTYPE html>

<html>

<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>发布商品</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body { background:linear-gradient(135deg,#aee4ff 0%,#ffccd5 50%,#aee4ff 100%);min-height:100vh;font-family:'Segoe UI',system-ui,-apple-system,sans-serif; }

.container { max-width: 800px; margin: 30px auto; }

.card { border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }

.preview-img { max-width: 120px; max-height: 120px; border-radius: 8px; border: 1px solid #ddd; margin-top: 8px; }

.upload-area { border: 2px dashed #dee2e6; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; transition: 0.3s; }

.upload-area:hover { border-color: #0d6efd; background-color: #f8f9ff; }

</style>

</head>

<body>

<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h2>📦 发布新商品</h2>

        <a href="/" class="btn btn-secondary">← 返回首页</a>

    </div>

    <div class="card"><div class="card-body p-4">

        <form method="POST" action="{{ url_for('add_product') }}" enctype="multipart/form-data">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

            <div class="row">

                <div class="col-md-6 mb-3"><label class="form-label">发布类型 *</label>

                    <select class="form-control" name="type" required>

                        <option value="1">🟢 出售</option><option value="0">🟠 求购</option>

                    </select>

                </div>

                <div class="col-md-6 mb-3"><label class="form-label">价格（元）*</label>

                    <input type="number" step="0.01" class="form-control" name="price" required>

                </div>

                <div class="col-12 mb-3"><label class="form-label">商品名称 *</label>

                    <input type="text" class="form-control" name="name" required>

                </div>

                <div class="col-12 mb-3"><label class="form-label">商品描述</label>

                    <textarea class="form-control" name="description" rows="3"></textarea>

                    <div class="upload-area mt-2" onclick="document.getElementById('descImage').click()">

                        <span>📷 点击上传描述图片（选填）</span>

                        <input type="file" id="descImage" name="desc_image" accept="image/*" style="display:none" onchange="previewImage(this, 'descPreview')">

                    </div>

                    <img id="descPreview" class="preview-img" style="display:none;">

                </div>

                <div class="col-12 mb-3"><label class="form-label">📞 联系方式 *</label>

                    <input type="text" class="form-control" name="contact" required>

                    <div class="upload-area mt-2" onclick="document.getElementById('contactImage').click()">

                        <span>📷 上传联系方式图片（选填）</span>

                        <input type="file" id="contactImage" name="contact_image" accept="image/*" style="display:none" onchange="previewImage(this, 'contactPreview')">

                    </div>

                    <img id="contactPreview" class="preview-img" style="display:none;">

                </div>

            </div>

            <div class="mb-3"><label class="form-label">商品标签（可多选，选填）</label>
                <div class="d-flex flex-wrap gap-3">
                    {% for t in all_tags %}<label style="cursor:pointer;"><input type="checkbox" name="tags" value="{{ t }}" style="margin-right:4px;">{{ t }}</label>{% endfor %}
                </div>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2">✅ 发布商品</button>

        </form>

    </div></div>

</div>

<script>

function previewImage(input, previewId) {

    var preview = document.getElementById(previewId);

    if (input.files && input.files[0]) {

        var reader = new FileReader();

        reader.onload = function(e) {

            preview.src = e.target.result;

            preview.style.display = 'block';

        }

        reader.readAsDataURL(input.files[0]);

    }

}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
