<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账号已被禁言</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #aee4ff 0%, #ffccd5 50%, #aee4ff 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .card-ban {
      background: rgba(255,255,255,0.92);
      border-radius: 22px;
      padding: 40px 48px;
      max-width: 460px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    .ban-emoji { font-size: 56px; }
    .ban-title { color: #d6336c; font-weight: 800; margin: 12px 0 8px; }
    .ban-text { color: #555; line-height: 1.7; }
  </style>
</head>
<body>
  <div class="card-ban">
    <div class="ban-emoji">🚫</div>
    <h3 class="ban-title">账号当前处于禁言期</h3>
    <p class="ban-text">
      由于平台管理需要，您的账号已被禁言，暂时无法发送消息、发布商品、收藏或购买。<br>
      禁言解除后相关功能将自动恢复。如有疑问，请联系平台管理员。
    </p>
    <div class="mt-4 d-flex gap-2 justify-content-center">
      <a href="/" class="btn btn-primary" style="border-radius:20px;">返回首页</a>
      <a href="/profile" class="btn btn-outline-secondary" style="border-radius:20px;">个人中心</a>
    </div>
  </div>
</body>
</html>
