<!DOCTYPE html>






<html>






<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>补填学号</title>






<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">






<style>body{background:linear-gradient(135deg,#aee4ff 0%,#ffccd5 50%,#aee4ff 100%);min-height:100vh;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}.container{max-width:500px;margin:80px auto;}</style>






</head>






<body>






<div class="container"><div class="card"><div class="card-body p-4">






    <h4 class="text-center">📝 补填学号</h4>






    <p class="text-muted">根据学校规定，您需要补填学号才能发布商品。学号以20开头，共15位。</p>






    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}






    <form method="POST">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">






        <div class="mb-3"><label class="form-label">学号</label><input type="text" class="form-control" name="student_id" placeholder="202011111111111" required pattern="^20\d{13}$"></div>






        <button type="submit" class="btn btn-primary w-100">提交</button>






    </form>

    <form method="POST" action="{{ url_for('logout') }}">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="btn btn-secondary w-100 mt-2">退出登录</button>
    </form>






</div></div></div>






</body>






</html>
